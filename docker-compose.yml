version: '3.8'

services:
  # Nginx Reverse Proxy for Laravel Backend
  nginx:
    image: nginx:alpine
    container_name: shoplagbe_nginx
    restart: unless-stopped
    ports:
      - "8000:80"
    volumes:
      - ./backend:/var/www/backend
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - php
    networks:
      - shoplagbe_network

  # PHP-FPM Application Server (PHP 8.4)
  php:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: shoplagbe_php
    restart: unless-stopped
    working_dir: /var/www/backend
    volumes:
      - ./backend:/var/www/backend
    environment:
      APP_ENV: local
      APP_DEBUG: "true"
      DB_HOST: postgres
      DB_DATABASE: shoplagbe_db
      DB_USERNAME: shoplagbe_user
      DB_PASSWORD: shoplagbe_secure_password
      REDIS_HOST: redis
    depends_on:
      - postgres
      - redis
    networks:
      - shoplagbe_network

  # Queue Worker for Background Delivery & Sync Jobs
  queue_worker:
    build:
      context: ./docker/php
      dockerfile: Dockerfile
    container_name: shoplagbe_queue_worker
    restart: unless-stopped
    working_dir: /var/www/backend
    command: php artisan queue:work --sleep=3 --tries=3 --timeout=90
    volumes:
      - ./backend:/var/www/backend
    depends_on:
      - php
      - redis
      - postgres
    networks:
      - shoplagbe_network

  # PostgreSQL 16 Database
  postgres:
    image: postgres:16-alpine
    container_name: shoplagbe_postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: shoplagbe_db
      POSTGRES_USER: shoplagbe_user
      POSTGRES_PASSWORD: shoplagbe_secure_password
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - shoplagbe_network

  # Redis Cache & Queue
  redis:
    image: redis:7-alpine
    container_name: shoplagbe_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    networks:
      - shoplagbe_network

  # Next.js 15 App Router Frontend
  frontend:
    build:
      context: ./docker/frontend
      dockerfile: Dockerfile
    container_name: shoplagbe_frontend
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000/api
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    networks:
      - shoplagbe_network

volumes:
  pgdata:
    driver: local
  redisdata:
    driver: local

networks:
  shoplagbe_network:
    driver: bridge
